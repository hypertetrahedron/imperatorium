[package]
name = "imperatorium"
version = "0.3.0-dev"
edition = "2021"
license = "MIT"
description = "Imperatorium as one binary: hooks, statusline and permission policy first (see docs/native-port.md)."
publish = false

[dependencies]
# preserve_order: Python dicts keep insertion order, and the policy's
# "most specific project wins, first one on a tie" depends on it.
# arbitrary_precision: a transcript's numbers pass through exactly as written
# (Python keeps big integers exact; an f64 would not).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
unicode-normalization = "0.1"
# The HTTP API (phase 3): small, threaded, no async runtime.
tiny_http = "0.12"
sha1 = "0.10"
# The binary pushed to a remote host is checked by SHA-256 (phase 4).
sha2 = "0.10"
# Python dict order, deletions included (sessionstat).
indexmap = "2"
# The window token, as secrets.token_urlsafe.
getrandom = "0.2"
regex = "1"
# http to 127.0.0.1 for the hooks; TLS (rustls) only for an ntfy push to
# an https server.
ureq = { version = "2", default-features = false }
# The Stream Deck surface (feature `streamdeck`).
elgato-streamdeck = { version = "0.14", optional = true }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
ab_glyph = { version = "0.2", optional = true }

[features]
# TLS for an ntfy push to an https server - the dispatcher's only https.
# A remote host's build leaves it out (`--no-default-features`): rustls'
# ring needs a C compiler for the target, and the host never sends one.
default = ["tls", "streamdeck"]
tls = ["ureq/tls"]
# `imperatorium streamdeck` (phase 5): the Stream Deck surface, over hidapi's
# own Windows backend (no hidapi.dll). Left out of a remote host's build.
streamdeck = ["dep:elgato-streamdeck", "dep:hidapi", "dep:image", "dep:ab_glyph"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
