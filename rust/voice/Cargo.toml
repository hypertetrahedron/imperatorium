[package]
name = "imperatorium-voice"
version = "0.3.0-dev"
edition = "2021"
license = "MIT"
description = "Imperatorium's dictation worker: whisper.cpp in a child process the dispatcher keeps (phase 5)."
publish = false

# Its own workspace: whisper.cpp needs a C++ compiler, CMake and (for the
# GPU) the CUDA toolkit, which the main binary must never need.
[workspace]

[features]
default = ["cuda"]
cuda = ["whisper-rs/cuda"]
# Releases: any GPU through the driver's Vulkan, nothing large to ship
# (the CUDA build needs ~770 MB of cuBLAS DLLs beside it).
vulkan = ["whisper-rs/vulkan"]

[dependencies]
whisper-rs = { version = "0.16", features = ["raw-api"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
