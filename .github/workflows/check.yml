# Tests on every push and pull request; release.yml calls this too, so a tag
# cannot publish a build that fails them.
#
# Windows is the platform the dispatcher runs on and the one the whole suite
# is written for: it is the gate. Ubuntu runs the same steps; the tests that
# need Windows say so and are skipped there.
#
# Everything is Rust and node: the Python reference the binary was ported
# from is gone (tag `last-python`); its answers live on as the goldens in
# rust/imperatorium/tests/golden, which the integration tests replay.
name: check

on:
  push:
    branches: ["**"]   # not tags: release.yml calls this for those
  pull_request:
  workflow_call:

# A newer push to the same branch makes an older run moot.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain every job builds with, release.yml's too: a new stable on
  # the runners cannot change what a commit compiles to or which lints fire.
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The window's JavaScript tests (imperatorium/web/tests) need node; the
      # runners have it, and setup-node pins the version the tests are run with.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # fakecli (the stand-in claude.exe / wt.exe / ssh the twins put on PATH)
      # is built first, so the integration tests find it beside the binary.
      # Linux builds are without the Stream Deck surface, as release.yml's are
      # (hidapi's Windows backend is the only one used). --locked: the build
      # uses Cargo.lock as committed, or fails.
      - name: cargo build
        working-directory: rust
        run: |
          if [ "$RUNNER_OS" = Linux ]; then flags=--no-default-features; fi
          cargo build --workspace --locked $flags

      # Lints are errors on the gate. (Ubuntu builds a different feature set,
      # whose dead-code warnings are not worth gating on.)
      - name: cargo clippy
        if: runner.os == 'Windows'
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The goldens were recorded on a machine in US Eastern time: the twins
      # compare the times they print ("resets 19:00"), so the runner keeps
      # that clock too.
      - name: Time zone of the goldens
        run: |
          if [ "$RUNNER_OS" = Windows ]; then MSYS_NO_PATHCONV=1 tzutil /s "Eastern Standard Time"
          else sudo timedatectl set-timezone America/New_York; fi

      # --no-fail-fast: one run shows every failing test binary, not the first.
      - name: cargo test
        working-directory: rust
        env:
          IMPERATORIUM_REQUIRE_NODE: "1"   # web_js.rs must run node, not skip
          # gh words its "not logged in" error differently inside Actions; the
          # worktree twin's golden has the wording everyone else sees.
          GITHUB_ACTIONS: ""
        run: |
          if [ "$RUNNER_OS" = Linux ]; then flags=--no-default-features; fi
          cargo test --workspace --locked --no-fail-fast $flags

      # The window's JavaScript, directly (cargo test above also runs it, via
      # rust/imperatorium/tests/web_js.rs; this shows its output on its own).
      - name: node --test (window JavaScript)
        run: node --test imperatorium/web/tests/*.test.mjs

  # Known vulnerabilities in the locked dependencies (RustSec), for the
  # binary's workspace and the dictation worker's.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: |
          (cd rust && cargo audit)
          (cd rust/voice && cargo audit)

  # Line coverage of the Rust code by the whole suite (unit, integration and
  # twins - the dispatcher processes the tests start are instrumented too),
  # as lcov.info and an HTML report in the run's artifacts, and a summary in
  # the log. Reported, not gated.
  coverage:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: coverage
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Time zone of the goldens
        run: MSYS_NO_PATHCONV=1 tzutil /s "Eastern Standard Time"
      - name: cargo llvm-cov
        working-directory: rust
        env:
          IMPERATORIUM_REQUIRE_NODE: "1"
          GITHUB_ACTIONS: ""
        run: |
          # fakecli (a stub, so not instrumented) goes beside the binary in
          # llvm-cov's own target folder, where the integration tests look;
          # cargo test builds only its test harness.
          cargo build -p fakecli --locked --target-dir target/llvm-cov-target
          # The examples (fakessh, the stand-in ssh the remote tests run) likewise.
          cargo build -p imperatorium --examples --locked --target-dir target/llvm-cov-target
          # Not gated: a failing test is the check job's to report; here it
          # only warns, and the report is still made.
          cargo llvm-cov --workspace --locked --no-fail-fast --no-report \
            || echo "::warning::tests failed under coverage (the check job gates them)"
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          tail -n 1 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            rust/lcov.info
            rust/coverage-summary.txt
            rust/coverage/html
